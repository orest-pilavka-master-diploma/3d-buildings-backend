spring.application.name=3d-buildings-backend

server.port=8082

geo.data.file=src/main/resources/buildings-3d-v20260506204248.geojson

# Geohash-tiled building data. tiles-root holds one or more v<timestamp> version
# directories, each a prefix-nested tree of <geohash>.geojson leaf files.
geo.tiles.root=${GEO_TILES_ROOT:C:/Users/opilavka/Documents/master-diploma-lnu/data/output/lviv}
# The geohash precision the compiler stored leaves at (must match the compiler).
geo.tiles.stored-level=${GEO_TILES_STORED_LEVEL:6}
# Safety cap: max geohashes accepted per /tiles request.
geo.tiles.max-geohashes=${GEO_TILES_MAX_GEOHASHES:256}

elastic.base-url=${ELASTIC_BASE_URL:localhost:9201}
elastic.token=${ELASTIC_TOKEN:bXNJU1pLRUI4SjcycTJFbEJuVFI6QURPemlwQ3hTaHlZVkpSY2dRN3dWZw==}

# Elasticsearch client timeouts. These are applied directly to the client in
# ElasticClientConfig (the Spring Boot "spring.elasticsearch.*" properties do
# not apply because the client is built manually). The socket timeout must be
# well above the default 5s or long bulk-index requests abort with
# "5,000 milliseconds timeout on connection ... [ACTIVE]".
elastic.connect-timeout-ms=${ELASTIC_CONNECT_TIMEOUT_MS:10000}
elastic.socket-timeout-ms=${ELASTIC_SOCKET_TIMEOUT_MS:120000}